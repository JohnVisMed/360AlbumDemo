<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WebXRDemoProject</title>
    <meta name="description" content="360 residence WebXR demo">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#101824;color:white;font-family:sans-serif}#unity-container{width:100%;position:relative;left:auto;top:auto;transform:none}#unity-footer{height:60px}#unity-webgl-logo{display:none}button{padding:10px 20px;margin:6px;border-radius:6px}#xr-status{font-size:13px;padding:8px}#enterar{display:none!important}#entervr:enabled,#entervr:disabled{width:auto;min-width:110px;height:42px}#unity-webxr-link{font-size:12px}canvas{touch-action:none}#unity-footer{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 10px;box-sizing:border-box;height:110px}#xr-status{flex:1;min-width:160px}#unity-build-title{display:none}#unity-webxr-link{order:3;width:100%;line-height:18px}#entervr{flex-shrink:0;float:none!important}body{overflow:hidden}</style>
</head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>Enter VR</button>
        <button id="enterar" value="Enter AR" disabled hidden>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <span id="xr-status">Checking VR support...</span><div id="unity-build-title">WebXRDemoProject</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebXRDemo.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebXRDemo.data",
        frameworkUrl: buildUrl + "/WebXRDemo.framework.js",
        codeUrl: buildUrl + "/WebXRDemo.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebXRDemoProject",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      // Native WebXR only; no legacy WebVR polyfill.

      canvasContainer.style.width = "100%";
      canvasContainer.style.height = "calc(100dvh - 110px)";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      if (!window.isSecureContext) document.getElementById('xr-status').textContent = 'VR requires HTTPS or localhost.';
      else if (!navigator.xr) document.getElementById('xr-status').textContent = 'This browser has no WebXR. Desktop viewing is available.';
      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported; document.getElementById('xr-status').textContent = event.detail.supported ? 'Quest: Enter VR, then A / trigger to change photo' : 'VR unavailable here. Drag to look; use Next photo.';
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
