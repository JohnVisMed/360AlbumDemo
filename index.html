<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WebXRDemoProject</title>
    <meta name="description" content="360 residence WebXR demo">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#101824;color:white;font-family:sans-serif}#unity-container{width:100%;position:relative;left:auto;top:auto;transform:none}#unity-footer{height:60px}#unity-webgl-logo{display:none}button{padding:10px 20px;margin:6px;border-radius:6px}#xr-status{font-size:13px;padding:8px}#enterar{display:none!important}#entervr:enabled,#entervr:disabled{width:auto;min-width:110px;height:42px}#unity-webxr-link{font-size:12px}canvas{touch-action:none}#unity-footer{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 10px;box-sizing:border-box;height:110px}#xr-status{flex:1;min-width:160px}#unity-build-title{display:none}#unity-webxr-link{order:3;width:100%;line-height:18px}#entervr{flex-shrink:0;float:none!important}body{overflow:hidden}#entervr[hidden]{display:none!important}#album-setup{position:fixed;inset:0;z-index:100;background:#101824;overflow:auto;padding:24px;box-sizing:border-box}#album-setup[hidden]{display:none}#album-setup h1{font-size:26px}#album-setup p{max-width:760px;line-height:1.6}#photo-list{padding:0;max-width:900px;list-style:none}#photo-list li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#1d2938;padding:10px;margin:8px 0;border-radius:8px}#photo-list img{width:100px;height:50px;object-fit:cover}#photo-list span{flex:1;min-width:100px;overflow-wrap:anywhere}#photo-list button{padding:7px 10px;margin:0}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}input{max-width:100%}</style>
</head>
  <body>
    <section id="album-setup">
      <h1>建立你的 360 相簿</h1>
      <p>選擇 2:1 的 JPG／PNG 全景相片，調整次序後開始觀看。相片只在本機讀取，不會傳到伺服器。</p>
      <label class="pick">選擇相片 <input id="photo-files" type="file" accept="image/jpeg,image/png" multiple></label>
      <p id="photo-status" role="status">可選多張相片，再用上移／下移調整播放次序。重新整理後需重新選擇。</p>
      <ol id="photo-list"></ol>
      <button id="start-photos" disabled>開始觀看我的相簿</button>
      <button id="start-demo">觀看示範相簿</button>
    </section>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled hidden>Enter VR</button>
        <button id="enterar" value="Enter AR" disabled hidden>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <span id="xr-status">Drag to look; tap Next photo to change rooms.</span><div id="unity-build-title">WebXRDemoProject</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebXRDemo.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebXRDemo.data",
        frameworkUrl: buildUrl + "/WebXRDemo.framework.js",
        codeUrl: buildUrl + "/WebXRDemo.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebXRDemoProject",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      // Native WebXR only; no legacy WebVR polyfill.

      canvasContainer.style.width = "100%";
      canvasContainer.style.height = "calc(100dvh - 110px)";
      loadingBar.style.display = "none";
      var pendingAlbum = null;
      var engineStarted = false;
      function startUnity(photos) {
      pendingAlbum = photos;
      if (unityInstance) { deliverAlbum(); return; }
      if (engineStarted) return;
      engineStarted = true;
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          updateVRButton();
          deliverAlbum();
          loadingBar.style.display = "none";
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          window.dispatchEvent(new CustomEvent("album-import-result", {detail:"啟動失敗，請重新整理後再試：" + message}));
        });
      };
      script.onerror = () => window.dispatchEvent(new CustomEvent('album-import-result', {detail:'無法載入播放器，請重新整理後再試。'}));
      document.body.appendChild(script);
      }
      function deliverAlbum() {
        if (pendingAlbum) unityInstance.SendMessage('WebXR Album', 'LoadPhotosJson', JSON.stringify({photos:pendingAlbum}));
        else window.dispatchEvent(new CustomEvent('album-import-result', {detail:''}));
      }

      // Phone and desktop stay in single-view mode. Only Quest gets a VR entry point.
      const isQuestBrowser = /OculusBrowser|Quest Browser/i.test(navigator.userAgent);
      const enterVRButton = document.getElementById('entervr');
      const xrStatus = document.getElementById('xr-status');
      let supportsImmersiveVR = false;

      function updateVRButton() {
        const available = isQuestBrowser && window.isSecureContext && supportsImmersiveVR;
        enterVRButton.hidden = !available;
        enterVRButton.disabled = !available || !unityInstance;
        xrStatus.textContent = available
          ? 'Quest: Enter VR, then A / trigger to change photo.'
          : 'Drag to look; tap Next photo to change rooms.';
        if (isQuestBrowser && !window.isSecureContext)
          xrStatus.textContent = 'Quest VR requires HTTPS. Drag to look in the meantime.';
      }

      document.addEventListener('onVRSupportedCheck', function (event) {
        supportsImmersiveVR = !!event.detail.supported;
        updateVRButton();
      }, false);
      enterVRButton.addEventListener('click', function () {
        if (!enterVRButton.hidden && !enterVRButton.disabled && unityInstance)
          unityInstance.Module.WebXR.toggleVR();
      }, false);
      updateVRButton();

    </script>
    <script src="album-setup.js"></script>
    <script src="hotspot-editor.js"></script>
  </body>
</html>
